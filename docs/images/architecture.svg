<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Outer Card Canvas (high contrast in both GitHub Light & Dark themes) -->
  <rect x="8" y="8" width="904" height="444" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="24" y="22" width="872" height="54" rx="10" fill="#1e293b"/>
  <text x="460" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Google Antigravity 插件创意工坊（Plugin Workshop）系统架构图</text>
  <text x="460" y="66" text-anchor="middle" font-size="11.5" fill="#94a3b8">填补 Antigravity 本体暂无原生中文侧边栏插件商店 / 镜像加速下载 / 文档一键翻译的空白</text>

  <!-- Column 1: Antigravity Sidebar UI (index.html) -->
  <rect x="28" y="96" width="248" height="334" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="28" y="96" width="248" height="36" rx="12" fill="#eff6ff"/>
  <rect x="28" y="120" width="248" height="12" fill="#eff6ff"/>
  <text x="152" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">① Antigravity 原生侧边栏 (UI)</text>

  <rect x="44" y="148" width="216" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="152" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">发现 / 已安装 双标签体系</text>
  <text x="152" y="185" text-anchor="middle" font-size="10.5" fill="#475569">7 大领域分类 · 精选+实时混排不丢失</text>

  <rect x="44" y="208" width="216" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="152" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">摘要展示 + 下拉抽屉详情</text>
  <text x="152" y="245" text-anchor="middle" font-size="10.5" fill="#475569">平台/风险标签 · 核心功能 · 适用场景</text>

  <rect x="44" y="268" width="216" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="152" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">侧边栏内嵌 README 阅读器</text>
  <text x="152" y="305" text-anchor="middle" font-size="10.5" fill="#475569">多语言切换 · 一键翻译正文 · 浏览器直达</text>

  <rect x="44" y="328" width="216" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="152" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">冷启动 / 依赖缺失预警</text>
  <text x="152" y="365" text-anchor="middle" font-size="10.5" fill="#78350f">提示 npx/uvx 环境缺口 · 免手动重启</text>

  <text x="152" y="408" text-anchor="middle" font-size="10.5" fill="#64748b">挂载位置：AUX_PANE（与 Swarm 同级）</text>

  <!-- Column 2: Sidecar Node Backend (main.mjs) -->
  <rect x="330" y="96" width="260" height="334" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="330" y="96" width="260" height="36" rx="12" fill="#eef2ff"/>
  <rect x="330" y="120" width="260" height="12" fill="#eef2ff"/>
  <text x="460" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4338ca">② Sidecar 本地引擎 (main.mjs)</text>

  <rect x="346" y="148" width="228" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="460" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">/api/catalog &amp; /api/search-github</text>
  <text x="460" y="185" text-anchor="middle" font-size="10.5" fill="#475569">精选 34+ 汉化目录 + 全网分批翻页检索</text>

  <rect x="346" y="208" width="228" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="460" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">/api/install（防锁隔离解压机制）</text>
  <text x="460" y="245" text-anchor="middle" font-size="10.5" fill="#475569">镜像加速 → workshop_tmp 解压 → 自动补全清单</text>

  <rect x="346" y="268" width="228" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="460" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">/api/readme &amp; /api/translate</text>
  <text x="460" y="305" text-anchor="middle" font-size="10.5" fill="#475569">保护代码块分段翻译 · 支持简/繁/双语/日/韩</text>

  <rect x="346" y="328" width="228" height="48" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="460" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">inspectPluginRuntime()</text>
  <text x="460" y="365" text-anchor="middle" font-size="10.5" fill="#047857">安装后自动扫描 Skills/MCP 与 PATH 运行环境</text>

  <text x="460" y="408" text-anchor="middle" font-size="10.5" fill="#64748b">基于 Antigravity 内置 sidecar_sdk 运行（零外部依赖）</text>

  <!-- Column 3: External Network & Local Antigravity FS -->
  <!-- Top box: Network Sources -->
  <rect x="644" y="96" width="248" height="156" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="644" y="96" width="248" height="34" rx="12" fill="#fffbeb"/>
  <rect x="644" y="118" width="248" height="12" fill="#fffbeb"/>
  <text x="768" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">③ 云端检索与镜像网络</text>

  <rect x="660" y="142" width="216" height="42" rx="7" fill="#fefce8" stroke="#fde68a"/>
  <text x="768" y="160" text-anchor="middle" font-size="11.5" font-weight="600" fill="#713f12">GitHub Search / Raw README</text>
  <text x="768" y="176" text-anchor="middle" font-size="10" fill="#854d0e">动态拉取全站社区开源仓库与文档</text>

  <rect x="660" y="194" width="216" height="42" rx="7" fill="#fefce8" stroke="#fde68a"/>
  <text x="768" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#713f12">多通道下载：ghfast.top → 直连</text>
  <text x="768" y="228" text-anchor="middle" font-size="10" fill="#854d0e">ZIP 镜像加速与自动失败回退链路</text>

  <!-- Bottom box: Antigravity Native Runtime -->
  <rect x="644" y="274" width="248" height="156" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="644" y="274" width="248" height="34" rx="12" fill="#ecfdf5"/>
  <rect x="644" y="296" width="248" height="12" fill="#ecfdf5"/>
  <text x="768" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">④ Antigravity 全局插件底座</text>

  <rect x="660" y="320" width="216" height="44" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="768" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">~/.gemini/config/plugins/&lt;id&gt;/</text>
  <text x="768" y="354" text-anchor="middle" font-size="10" fill="#065f46">自动识别 Junction 映射非系统盘（零 C 盘膨胀）</text>

  <rect x="660" y="374" width="216" height="44" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="768" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">plugin.json / skills / mcp_config.json</text>
  <text x="768" y="408" text-anchor="middle" font-size="10" fill="#065f46">挂载至插件栏与 config.json 启停状态同步</text>

  <!-- Arrows -->
  <path d="M 278 240 L 326 240" stroke="#4f46e5" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 326 280 L 278 280" stroke="#4f46e5" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <text x="302" y="232" text-anchor="middle" font-size="9.5" fill="#4338ca">REST</text>
  <text x="302" y="295" text-anchor="middle" font-size="9.5" fill="#4338ca">JSON</text>

  <path d="M 592 174 L 640 174" stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M 640 212 L 592 212" stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#arrow-amber)"/>

  <path d="M 592 340 L 640 340" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 640 378 L 592 378" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
</svg>
